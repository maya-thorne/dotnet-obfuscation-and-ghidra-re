title: Invocation of CheckRemoteDebuggerPresent Anti-Analysis
id: proc_creation_win_checkremotedebuggerpresent
status: production
description: |
  Enterprise EDR/SIEM detection rule for Invocation of CheckRemoteDebuggerPresent Anti-Analysis.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1497.001
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CallTrace|contains: 'CheckRemoteDebuggerPresent'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: medium
