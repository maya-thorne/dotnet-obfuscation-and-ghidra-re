title: Execution of Executable from Temp Directory Spawned by User Process
id: proc_creation_win_temp_dropper_exec
status: production
description: |
  Enterprise EDR/SIEM detection rule for Execution of Executable from Temp Directory Spawned by User Process.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1027.002
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: '\AppData\Local\Temp\'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: high
