title: Execution of dnSpy .NET Debugger / Decompiler
id: proc_creation_win_dnspy_reverse_eng
status: production
description: |
  Enterprise EDR/SIEM detection rule for Execution of dnSpy .NET Debugger / Decompiler.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1588.002
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\dnSpy.exe'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: medium
