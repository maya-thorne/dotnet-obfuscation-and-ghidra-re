title: Creation of Random Named Executable in Local AppData Temp
id: file_create_win_temp_random_exe
status: production
description: |
  Enterprise EDR/SIEM detection rule for Creation of Random Named Executable in Local AppData Temp.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1027
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    TargetFilename|contains: '\AppData\Local\Temp\'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: high
