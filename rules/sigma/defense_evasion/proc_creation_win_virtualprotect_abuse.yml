title: VirtualProtect Memory Page Modification by Managed Binary
id: proc_creation_win_virtualprotect_abuse
status: production
description: |
  Enterprise EDR/SIEM detection rule for VirtualProtect Memory Page Modification by Managed Binary.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1055.002
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CallTrace|contains: 'VirtualProtect'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: high
