title: Large Base64 String Passed as Commandline Argument
id: proc_creation_win_base64_xor_arg_pass
status: production
description: |
  Enterprise EDR/SIEM detection rule for Large Base64 String Passed as Commandline Argument.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1027
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|re: '[A-Za-z0-9+/=]{100,}'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: high
