title: Parent-Child Hierarchy Matching xorStub Dropper Behavior
id: proc_creation_win_xorstub_parent_child
status: production
description: |
  Enterprise EDR/SIEM detection rule for Parent-Child Hierarchy Matching xorStub Dropper Behavior.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1055
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: 'xorStub.exe'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: critical
