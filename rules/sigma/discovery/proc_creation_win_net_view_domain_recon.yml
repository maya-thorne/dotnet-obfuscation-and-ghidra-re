title: Net View Command Enumerating Active Directory Domain
id: proc_creation_win_net_view_domain_recon
status: production
description: |
  Enterprise EDR/SIEM detection rule for Net View Command Enumerating Active Directory Domain.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1087.002
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: 'net view'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: medium
