title: InstallUtil Execution with Obfuscated Uninstall Method
id: proc_creation_win_installutil_bypass
status: production
description: |
  Enterprise EDR/SIEM detection rule for InstallUtil Execution with Obfuscated Uninstall Method.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1218.004
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\InstallUtil.exe'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: high
