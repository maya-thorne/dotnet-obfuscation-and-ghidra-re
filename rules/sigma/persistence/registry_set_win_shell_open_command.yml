title: File Association Hijack Pointing to Obfuscated Executable
id: registry_set_win_shell_open_command
status: production
description: |
  Enterprise EDR/SIEM detection rule for File Association Hijack Pointing to Obfuscated Executable.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1546.001
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    TargetObject|contains: '\shell\open\command\'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: high
