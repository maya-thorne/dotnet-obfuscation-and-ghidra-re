title: Installation of Windows Service Pointing to Packed Binary
id: service_install_win_packed_service_pe
status: production
description: |
  Enterprise EDR/SIEM detection rule for Installation of Windows Service Pointing to Packed Binary.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1543.003
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ImagePath|contains: 'packed_exe.exe'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: high
