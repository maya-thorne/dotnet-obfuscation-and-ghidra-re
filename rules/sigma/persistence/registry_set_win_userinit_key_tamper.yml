title: Userinit Registry Value Appending Managed Dropper
id: registry_set_win_userinit_key_tamper
status: production
description: |
  Enterprise EDR/SIEM detection rule for Userinit Registry Value Appending Managed Dropper.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
