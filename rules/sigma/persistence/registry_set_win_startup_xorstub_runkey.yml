title: Run Key Persistence for xorStub / Dropper Executable
id: registry_set_win_startup_xorstub_runkey
status: production
description: |
  Enterprise EDR/SIEM detection rule for Run Key Persistence for xorStub / Dropper Executable.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1547.001
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    TargetObject|contains: '\CurrentVersion\Run\'
  condition: selection
fields:
