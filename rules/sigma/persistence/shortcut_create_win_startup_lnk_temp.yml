title: Startup Folder LNK Shortcut Pointing to Dropped Temp Binary
id: shortcut_create_win_startup_lnk_temp
status: production
description: |
  Enterprise EDR/SIEM detection rule for Startup Folder LNK Shortcut Pointing to Dropped Temp Binary.
  Engineered by Maya Thorne. Part of the dotnet-obfuscation-and-ghidra-re suite.
author: Maya Thorne (Systems & Detection Engineering Research)
date: 2026/10/11
license: MT-SRL
tags:
  - attack.t1547.009
  - attack.defense_evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    TargetFilename|contains: '\Start Menu\Programs\Startup\'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - Image
  - User
falsepositives:
  - Legitimate administrative software installers with temporary extractors
level: high
