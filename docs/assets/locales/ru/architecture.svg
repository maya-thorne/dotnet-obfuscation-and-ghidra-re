    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Stream Inspector</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">#Strings, #US, #Blob, #GUID</text>
    <text x="28" y="228" fill="#818cf8" font-family="ui-monospace, monospace" font-size="9.5">#~ Compressed table mask</text>

