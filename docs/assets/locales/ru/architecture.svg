    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Dynamic Key Inverter</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">ROT13Encode reverse loop</text>
    <text x="28" y="228" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9.5">Key: 'randomkey' inverting</text>

    <!-- Module 3.3 -->
