    <text x="18" y="32" fill="#10b981" font-family="ui-monospace, monospace" font-size="13" font-weight="700">4. BLUE TEAM DISPATCH</text>
    <text x="18" y="52" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10.5">Rules &amp; Mitigation</text>
    <line x1="18" y1="64" x2="232" y2="64" stroke="#1e293b" stroke-width="1"/>

    <!-- Module 4.1 -->
    <rect x="18" y="80" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="104" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">52 Sigma Rules</text>
    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Sysmon Event ID 1 / 4688</text>
    <text x="28" y="138" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">Temp Dropper telemetry</text>

    <!-- Module 4.2 -->
    <rect x="18" y="170" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">32 YARA Signatures</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">AntiTamper / AntiDump</text>
    <text x="28" y="228" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">Themida &amp; VMProtect</text>

    <!-- Module 4.3 -->
    <rect x="18" y="260" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="284" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MITRE ATT&amp;CK Matrix</text>
    <text x="28" y="302" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">T1027, T1055, T1497, T1036</text>
    <text x="28" y="318" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">Splunk &amp; Elastic feeds</text>

