    <text x="28" y="104" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Marker Scanner</text>
    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Token *** delimiter scan</text>
    <text x="28" y="138" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9.5">Pipe delimiter split</text>

    <!-- Module 3.2 -->
