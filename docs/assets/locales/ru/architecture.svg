<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="620" rx="16" fill="url(#archBg)"/>
  <rect x="1" y="1" width="1198" height="618" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="50" y="50" fill="url(#neonTitle)" font-family="ui-monospace, monospace" font-size="22" font-weight="900" text-rendering="geometricPrecision">
    АРХИТЕКТУРА ФОРЕНЗИКИ .NET И НАГИВНЫХ УПАКОВЩИКОВ
  </text>
  <text x="50" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-rendering="geometricPrecision">
    Статический Анализ · Метаданные CIL · Дизассемблирование Ghidra
  </text>

  <!-- 4 Architectural Columns (Card Width = 250px) -->

  <!-- Column 1: Binary Input & Static Disassembly -->
  <g transform="translate(50, 110)">
