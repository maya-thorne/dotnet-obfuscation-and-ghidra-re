    <text x="18" y="52" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10.5">PE &amp; CLR Parsing</text>
    <line x1="18" y1="64" x2="232" y2="64" stroke="#1e293b" stroke-width="1"/>

    <!-- Module 1.1 -->
    <rect x="18" y="80" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="104" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">PEOverlayDetector</text>
    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Section boundary calculation</text>
    <text x="28" y="138" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5">Overlay offset &amp; length</text>

    <!-- Module 1.2 -->
    <rect x="18" y="170" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Ghidra MCP Engine</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">re_triage_binary analysis</text>
    <text x="28" y="228" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5">re_disassemble_offset</text>

    <!-- Module 1.3 -->
    <rect x="18" y="260" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="284" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Shannon Entropy</text>
