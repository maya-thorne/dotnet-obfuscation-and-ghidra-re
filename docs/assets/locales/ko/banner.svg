<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Badge -->
  <rect x="50" y="36" width="310" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="64" y="55" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" text-rendering="geometricPrecision">
    ENTERPRISE BLUE TEAM DETECTION SUITE
  </text>

  <!-- Title & Subtitle -->
  <text x="50" y="125" fill="url(#cyanNeon)" font-family="ui-monospace, monospace" font-size="32" font-weight="900" text-rendering="geometricPrecision" filter="url(#glow)">
    .NET 난독화 & 기드라 역공학 연구실
  </text>
  <text x="50" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" text-rendering="geometricPrecision">
    블루팀 EDR/SIEM 탐지 엔지니어링 · 52개 Sigma 룰 · 32개 YARA 룰
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(50, 215)">
    <!-- Metric 1: Sigma -->
    <rect x="0" y="0" width="240" height="65" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="16" y="26" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SIGMA DETECTION RULES</text>
    <text x="16" y="50" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="18" font-weight="900">52 Modular Rules</text>

    <!-- Metric 2: YARA -->
    <rect x="260" y="0" width="240" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="276" y="26" fill="#10b981" font-family="ui-monospace, monospace" font-size="11" font-weight="700">YARA SIGNATURES</text>
    <text x="276" y="50" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="18" font-weight="900">32 Signatures</text>

    <!-- Metric 3: Protectors -->
    <rect x="520" y="0" width="250" height="65" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="536" y="26" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">FLAGSHIP PROTECTORS</text>
    <text x="536" y="50" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="18" font-weight="900">8 Toolchains Mapped</text>

    <!-- Metric 4: Ghidra MCP -->
    <rect x="790" y="0" width="270" height="65" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <text x="806" y="26" fill="#a855f7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">REVERSE ENGINEERING</text>
    <text x="806" y="50" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="18" font-weight="900">Ghidra MCP Triage</text>
  </g>
</svg>
