      <line x1="20" y1="66" x2="225" y2="66" stroke="#1e293b" stroke-width="1"/>

      <rect x="16" y="80" width="213" height="48" rx="6" fill="#1e293b"/>
      <text x="26" y="100" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">Shannon Entropy</text>
      <text x="26" y="116" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">Threshold evaluation (&gt; 7.2)</text>

      <rect x="16" y="140" width="213" height="48" rx="6" fill="#1e293b"/>
      <text x="26" y="160" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">Protector Classifier</text>
