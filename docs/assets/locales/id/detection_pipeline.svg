<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#040610"/>
    </linearGradient>
    <linearGradient id="pipeTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" rx="16" fill="url(#pipeBg)"/>
  <rect x="1" y="1" width="1198" height="478" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="50" y="50" fill="url(#pipeTitle)" font-family="ui-monospace, monospace" font-size="22" font-weight="900" text-rendering="geometricPrecision">
    PIPELINE DETEKSI BLUE TEAM EDR & SIEM
  </text>
  <text x="50" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-rendering="geometricPrecision">
    Penerimaan Telemetri · Deteksi Anomali · Pengiriman Peringatan
  </text>

  <!-- 4 Pipeline Flow Cards -->
  <g transform="translate(50, 115)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="245" height="300" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="20" y="34" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="700">TAHAP 01: TELEMETRI</text>
      <text x="20" y="54" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10">Sysmon EID 1 / 4688</text>
      <line x1="20" y1="66" x2="225" y2="66" stroke="#1e293b" stroke-width="1"/>

      <rect x="16" y="80" width="213" height="48" rx="6" fill="#1e293b"/>
      <text x="26" y="100" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">Sysmon Event ID 1</text>
      <text x="26" y="116" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">Parent-child dropper tracking</text>

      <rect x="16" y="140" width="213" height="48" rx="6" fill="#1e293b"/>
      <text x="26" y="160" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">Security Event 4688</text>
      <text x="26" y="176" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">Command line argument unmasking</text>

      <rect x="16" y="200" width="213" height="48" rx="6" fill="#1e293b"/>
      <text x="26" y="220" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">Sysmon Event ID 11</text>
      <text x="26" y="236" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">File creation in Temp directories</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 252 150 L 280 150 M 274 144 L 280 150 L 274 156" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <!-- Stage 2 -->
    <g transform="translate(288, 0)">
