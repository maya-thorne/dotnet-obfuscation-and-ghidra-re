      <rect x="16" y="200" width="213" height="48" rx="6" fill="#1e293b"/>
      <text x="26" y="220" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">32 YARA Signatures</text>
