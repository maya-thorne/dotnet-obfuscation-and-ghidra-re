      <text x="26" y="116" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">PointerToRawData + SizeOfRaw</text>

      <rect x="16" y="140" width="213" height="48" rx="6" fill="#1e293b"/>
      <text x="26" y="160" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">Overlay Carving</text>
      <text x="26" y="176" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">Extraction of appended data</text>

      <rect x="16" y="200" width="213" height="48" rx="6" fill="#1e293b"/>
      <text x="26" y="220" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">BSJB Stream Header</text>
      <text x="26" y="236" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">CLI Metadata directory trace</text>
